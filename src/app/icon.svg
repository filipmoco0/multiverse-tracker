<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Deep Dark App Background -->
  <rect width="512" height="512" fill="#0c0d14" />

  <!-- Centered -skewX(-6deg) group for 1:1 Navbar Match -->
  <g transform="translate(256, 256) skewX(-6) translate(-256, -256)">
    <!-- 1. Hard Solid Black Drop Shadow (offset +32px, +32px) -->
    <rect
      x="132"
      y="132"
      width="280"
      height="280"
      fill="#000000"
    />

    <!-- 2. Main Amber Box with Solid 24px Black Border -->
    <rect
      x="100"
      y="100"
      width="280"
      height="280"
      fill="#f59e0b"
      stroke="#000000"
      stroke-width="24"
      stroke-linejoin="miter"
    />

    <!-- 3. Exact Bebas Neue / Impact Bold Black "M" Geometry -->
    <path
      d="M 148,348 L 148,164 L 202,164 L 256,268 L 310,164 L 364,164 L 364,348 L 314,348 L 314,244 L 272,320 L 240,320 L 198,244 L 198,348 Z"
      fill="#000000"
    />
  </g>
</svg>
