<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark background -->
  <rect width="512" height="512" fill="#0c0d14" />

  <!-- Large Yellow Box filling 85% of space -->
  <g transform="translate(256, 256) skewX(-6) translate(-256, -256)">
    <!-- Solid Black Drop Shadow -->
    <rect
      x="72"
      y="72"
      width="390"
      height="390"
      rx="12"
      fill="#000000"
    />

    <!-- Main Yellow Box with Solid Black Border -->
    <rect
      x="44"
      y="44"
      width="390"
      height="390"
      rx="12"
      fill="#f59e0b"
      stroke="#000000"
      stroke-width="24"
      stroke-linejoin="miter"
    />

    <!-- Massive Bold Black "M" -->
    <path
      d="M 106,378 L 106,128 L 174,128 L 239,252 L 304,128 L 372,128 L 372,378 L 308,378 L 308,232 L 258,328 L 220,328 L 170,232 L 170,378 Z"
      fill="#000000"
    />
  </g>
</svg>
