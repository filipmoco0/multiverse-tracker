<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Deep Dark Background (iOS 18 Dark Mode will not touch this) -->
  <rect width="512" height="512" fill="#0c0d14" />

  <!-- Subtle Halftone / Comic Border -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="#fbbf24" stroke-width="12" opacity="0.4" />

  <!-- Exact User "M" shape in Glowing Golden Yellow #FBBF24 -->
  <g transform="translate(256, 256) skewX(-6) translate(-256, -256)">
    <!-- Yellow Glow / Shadow -->
    <path
      d="M 124,396 L 124,136 L 194,136 L 256,256 L 318,136 L 388,136 L 388,396 L 324,396 L 324,244 L 274,340 L 238,340 L 188,244 L 188,396 Z"
      fill="#f59e0b"
      transform="translate(8, 8)"
      opacity="0.3"
    />
    <!-- Main Yellow Letter "M" -->
    <path
      d="M 124,396 L 124,136 L 194,136 L 256,256 L 318,136 L 388,136 L 388,396 L 324,396 L 324,244 L 274,340 L 238,340 L 188,244 L 188,396 Z"
      fill="#fbbf24"
    />
  </g>
</svg>
