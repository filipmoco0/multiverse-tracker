<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Hard Neo-Brutalist 3D Drop Shadow -->
    <filter id="neoBrutalShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="32" dy="32" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Deep dark app background -->
  <rect width="512" height="512" rx="108" fill="#0c0d14" />

  <!-- Navbar-exact slanted -skew-x-6 Amber Box -->
  <g transform="translate(256, 256) skewX(-6) translate(-256, -256)">
    <!-- Yellow Box with Solid Black Border & Hard Black Shadow -->
    <rect
      x="100"
      y="100"
      width="312"
      height="312"
      rx="12"
      fill="#f59e0b"
      stroke="#000000"
      stroke-width="24"
      stroke-linejoin="miter"
      filter="url(#neoBrutalShadow)"
    />

    <!-- Exact Geometric Bold Black Letter "M" -->
    <path
      d="M 152,348 L 152,164 L 206,164 L 256,258 L 306,164 L 360,164 L 360,348 L 312,348 L 312,238 L 274,306 L 238,306 L 200,238 L 200,348 Z"
      fill="#000000"
    />
  </g>
</svg>
