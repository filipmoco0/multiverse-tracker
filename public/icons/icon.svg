<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141624" />
      <stop offset="100%" stop-color="#08090f" />
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="comicShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="12" dy="12" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Base background with rounded corners for mobile -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#000000" stroke-width="16" />

  <!-- Inner comic border -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.3" />

  <!-- Red & Cyan subtle accent triangles -->
  <polygon points="24,24 160,24 24,160" fill="#E62429" opacity="0.8" />
  <polygon points="488,488 352,488 488,352" fill="#00EAFF" opacity="0.8" />

  <!-- Central Comic "M" Box -->
  <g transform="translate(256, 256) rotate(-4) translate(-256, -256)" filter="url(#comicShadow)">
    <rect x="96" y="96" width="320" height="320" rx="36" fill="url(#mGrad)" stroke="#000000" stroke-width="16" />
    
    <!-- Comic Halftone dots inside box -->
    <circle cx="140" cy="140" r="8" fill="#000000" opacity="0.15" />
    <circle cx="180" cy="140" r="8" fill="#000000" opacity="0.15" />
    <circle cx="220" cy="140" r="8" fill="#000000" opacity="0.15" />
    <circle cx="260" cy="140" r="8" fill="#000000" opacity="0.15" />
    <circle cx="300" cy="140" r="8" fill="#000000" opacity="0.15" />
    <circle cx="340" cy="140" r="8" fill="#000000" opacity="0.15" />
    <circle cx="380" cy="140" r="8" fill="#000000" opacity="0.15" />

    <!-- Bold Comic Letter "M" -->
    <path d="M 150,340 L 150,172 L 210,172 L 256,260 L 302,172 L 362,172 L 362,340 L 312,340 L 312,236 L 274,310 L 238,310 L 200,236 L 200,340 Z" fill="#000000" />
    <path d="M 154,336 L 154,176 L 206,176 L 256,268 L 306,176 L 358,176 L 358,336 L 316,336 L 316,230 L 272,314 L 240,314 L 196,230 L 196,336 Z" fill="#ffffff" opacity="0.1" />
  </g>
</svg>
